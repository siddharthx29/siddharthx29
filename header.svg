<svg width="100%" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Siddharth — Full Stack Dev</title>
  <desc>Animated circuit board header with boot sequence text reveal</desc>

  <style>
    .bg { fill: #0a0f0a; }
    .trace { fill: none; stroke: #00ff41; stroke-width: 1; opacity: 0.18; }
    .trace-pulse {
      fill: none; stroke: #00ff41; stroke-width: 1.5; opacity: 0;
      animation: pulse 4s ease-in-out infinite;
    }
    .dot { fill: #00ff41; opacity: 0.25; }
    .dot-live { fill: #00ff41; animation: blink 2s ease-in-out infinite; }
    @keyframes pulse {
      0%   { opacity: 0; stroke-dashoffset: 400; }
      20%  { opacity: 0.7; }
      80%  { opacity: 0.7; }
      100% { opacity: 0; stroke-dashoffset: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.15; r: 2; }
      50%       { opacity: 1;    r: 3.5; }
    }
    .name {
      font-family: 'Courier New', monospace;
      font-size: 52px;
      font-weight: 700;
      fill: #00ff41;
      letter-spacing: 10px;
      opacity: 0;
      animation: reveal 1s ease forwards 0.4s;
    }
    @keyframes reveal {
      from { opacity: 0; letter-spacing: 30px; }
      to   { opacity: 1; letter-spacing: 10px; }
    }
    .tag {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #4dff7c;
      opacity: 0;
      animation: fadein 0.6s ease forwards;
    }
    .t1 { animation-delay: 1.1s; }
    .t2 { animation-delay: 1.5s; }
    .t3 { animation-delay: 1.9s; }
    @keyframes fadein {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 0.75; transform: translateX(0); }
    }
    .cursor {
      fill: #00ff41;
      animation: cur 1s step-end infinite 2.4s;
      opacity: 0;
    }
    @keyframes cur {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
    .scan {
      fill: none; stroke: #00ff41; stroke-width: 0.5; opacity: 0.07;
      animation: scan 6s linear infinite;
    }
    @keyframes scan {
      0%   { transform: translateY(-200px); }
      100% { transform: translateY(400px); }
    }
  </style>

  <rect class="bg" width="800" height="200" rx="10"/>

  <line class="trace" x1="0"   y1="30"  x2="800" y2="30"/>
  <line class="trace" x1="0"   y1="170" x2="800" y2="170"/>
  <line class="trace" x1="60"  y1="0"   x2="60"  y2="200"/>
  <line class="trace" x1="740" y1="0"   x2="740" y2="200"/>
  <line class="trace" x1="0"   y1="100" x2="60"  y2="100"/>
  <line class="trace" x1="740" y1="100" x2="800" y2="100"/>
  <line class="trace" x1="60"  y1="100" x2="60"  y2="170"/>
  <line class="trace" x1="740" y1="30"  x2="740" y2="100"/>
  <line class="trace" x1="20"  y1="30"  x2="20"  y2="170"/>
  <line class="trace" x1="780" y1="30"  x2="780" y2="170"/>
  <line class="trace" x1="20"  y1="70"  x2="60"  y2="70"/>
  <line class="trace" x1="740" y1="130" x2="780" y2="130"/>

  <line class="trace-pulse" x1="0" y1="30" x2="800" y2="30" stroke-dasharray="400" stroke-dashoffset="400" style="animation-delay:0s"/>
  <line class="trace-pulse" x1="0" y1="170" x2="800" y2="170" stroke-dasharray="400" stroke-dashoffset="400" style="animation-delay:2s"/>
  <line class="trace-pulse" x1="60" y1="0" x2="60" y2="200" stroke-dasharray="200" stroke-dashoffset="200" style="animation-delay:1s"/>
  <line class="trace-pulse" x1="740" y1="0" x2="740" y2="200" stroke-dasharray="200" stroke-dashoffset="200" style="animation-delay:3s"/>

  <circle class="dot-live" cx="60"  cy="30"  r="3"/>
  <circle class="dot-live" cx="740" cy="30"  r="3" style="animation-delay:0.7s"/>
  <circle class="dot-live" cx="60"  cy="170" r="3" style="animation-delay:1.4s"/>
  <circle class="dot-live" cx="740" cy="170" r="3" style="animation-delay:2.1s"/>
  <circle class="dot" cx="20"  cy="30"  r="2"/>
  <circle class="dot" cx="780" cy="30"  r="2"/>
  <circle class="dot" cx="20"  cy="170" r="2"/>
  <circle class="dot" cx="780" cy="170" r="2"/>
  <circle class="dot" cx="60"  cy="70"  r="2"/>
  <circle class="dot" cx="60"  cy="100" r="2"/>
  <circle class="dot" cx="740" cy="100" r="2"/>
  <circle class="dot" cx="740" cy="130" r="2"/>
  <circle class="dot" cx="20"  cy="70"  r="2"/>
  <circle class="dot" cx="780" cy="130" r="2"/>

  <rect class="scan" x="60" y="0" width="680" height="3"/>

  <text class="name" x="400" y="108" text-anchor="middle">SIDDHARTH</text>

  <text class="tag t1" x="400" y="135" text-anchor="middle">[ full-stack dev · open source · privacy-first ]</text>
  <text class="tag t2" x="400" y="152" text-anchor="middle">django · react · three.js · privacy-first</text>
  <text class="tag t3" x="400" y="169" text-anchor="middle" style="opacity:0;animation:fadein 0.6s ease forwards 2.3s;fill:#00ff41;">&gt; init TeamNext ERP...</text>

  <rect class="cursor" x="514" y="158" width="8" height="12" rx="1"/>
</svg>
